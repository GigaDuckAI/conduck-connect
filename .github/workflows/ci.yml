name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: source reproduces the single-file release artifact
        run: /bin/bash scripts/build-release.sh --check

      - name: shellcheck
        run: shellcheck --severity=warning conduck-connect.sh scripts/*.sh tests/*.sh

      - name: bash syntax (parse-only, never executes the wizard)
        run: bash -n conduck-connect.sh scripts/*.sh tests/*.sh

      - name: verify vendored QR encoder (pinned checksum + stdlib-only imports)
        run: bash scripts/verify-vendored-encoder.sh

      - name: URL-normalization parity fixtures (mirror of the app's Swift suite)
        run: bash scripts/test-url-normalization.sh

      - name: Apple-authoritative response compatibility corpus
        run: bash scripts/test-response-fixtures.sh

      - name: /v1/models probe classification (live local mock server)
        run: bash scripts/test-models-probe.sh

  connector-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Self-contained adapter/server/menu/command matrix against local fixture
      # servers over loopback. macos-latest intentionally exercises Apple's
      # system Bash 3.2, the oldest supported shell. The rclone integration
      # suite has an external dependency and stays manual.
      - name: adapter, server, menu, and command regression suite
        run: |
          /bin/bash scripts/build-release.sh --check
          /bin/bash tests/run-checks-suite.sh
