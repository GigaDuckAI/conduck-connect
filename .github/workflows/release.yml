name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches script version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/build-release.sh --check
          script_version=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' conduck-connect.sh)
          test -n "$script_version"
          test "$TAG" = "v$script_version" || {
            echo "release tag $TAG does not match conduck-connect VERSION $script_version" >&2
            exit 1
          }
          grep -qF "source is at \`v$script_version\`" README.md || {
            echo "README source status does not name v$script_version" >&2
            exit 1
          }
          grep -qF "## [$script_version]" CHANGELOG.md || {
            echo "CHANGELOG has no release heading for $script_version" >&2
            exit 1
          }

      - name: Verify before releasing
        run: |
          bash scripts/build-release.sh --check
          shellcheck --severity=warning conduck-connect.sh scripts/*.sh tests/*.sh
          bash -n conduck-connect.sh scripts/*.sh tests/*.sh
          bash scripts/verify-vendored-encoder.sh
          bash scripts/test-url-normalization.sh
          bash scripts/test-response-fixtures.sh
          bash scripts/test-models-probe.sh
          bash tests/run-checks-suite.sh

      - name: Generate checksum
        run: sha256sum conduck-connect.sh > conduck-connect.sh.sha256

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}   # built-in ref name; quoted below, never interpolated into shell
        run: |
          prerelease=()
          case "$TAG" in *-rc*|*-alpha*|*-beta*) prerelease=(--prerelease) ;; esac
          # No overwrite path: an existing release is an error, never a re-upload.
          # Published bytes are immutable — a changed byte gets a new version + tag
          # (the immutability promise in SECURITY.md).
          gh release create "$TAG" \
            conduck-connect.sh conduck-connect.sh.sha256 \
            LICENSE NOTICE THIRD_PARTY_NOTICES.md \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --verify-tag "${prerelease[@]}"
