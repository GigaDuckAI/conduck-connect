name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create releases and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify tag matches script version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/build-release.sh --check
          script_version=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' conduck-connect.sh)
          test -n "$script_version"
          test "$TAG" = "v$script_version" || {
            echo "release tag $TAG does not match conduck-connect VERSION $script_version" >&2
            exit 1
          }
          grep -qF "source is at \`v$script_version\`" README.md || {
            echo "README source status does not name v$script_version" >&2
            exit 1
          }
          grep -qF "## [$script_version]" CHANGELOG.md || {
            echo "CHANGELOG has no release heading for $script_version" >&2
            exit 1
          }

      - name: Verify before releasing
        run: |
          bash scripts/build-release.sh --check
          shellcheck --severity=warning conduck-connect.sh scripts/*.sh tests/*.sh
          bash -n conduck-connect.sh scripts/*.sh tests/*.sh
          bash scripts/verify-vendored-encoder.sh
          bash scripts/test-url-normalization.sh
          bash scripts/test-response-fixtures.sh
          bash scripts/test-models-probe.sh
          bash tests/run-checks-suite.sh

      - name: Generate checksum
        run: sha256sum conduck-connect.sh > conduck-connect.sh.sha256

      - name: Extract this version's release notes
        run: |
          # The body is this version's changelog section and nothing else: a
          # release whose notes carry every version ever shipped buries the one
          # thing its reader came for. The version is re-derived from the built
          # artifact rather than parsed out of the tag, because the step above
          # already proved the two agree and the artifact is what ships.
          # Every way this can be wrong stops the release instead of publishing
          # the wrong body: no heading, two headings, or a heading with nothing
          # under it. Published bytes are immutable, so a body is not fixable
          # after the fact — an unpublished release is the cheaper failure.
          # The version arrives as awk DATA, never as awk source, and a heading
          # is matched literally and only at a line start, outside code fences,
          # so neither a prerelease suffix nor an example in a fenced block can
          # be mistaken for the section boundary.
          script_version=$(sed -n 's/^VERSION="\([^"]*\)"$/\1/p' conduck-connect.sh)
          test -n "$script_version"
          awk -v ver="$script_version" '
            BEGIN { head = "## [" ver "]" }
            /^```/ { fence = !fence }
            fence { if (inside) print; next }
            index($0, head) == 1 &&
              (length($0) == length(head) || substr($0, length(head) + 1, 1) ~ /[ \t]/) {
              if (seen) { print "CHANGELOG.md carries more than one " head " heading" > "/dev/stderr"; exit 2 }
              seen = 1; inside = 1; print; next
            }
            inside && index($0, "## [") == 1 { inside = 0 }
            inside { print }
            END { if (!seen) { print "CHANGELOG.md carries no " head " heading" > "/dev/stderr"; exit 1 } }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md" || {
            echo "cannot take a release body for $script_version out of CHANGELOG.md" >&2
            exit 1
          }
          body_lines=$(sed 1d "$RUNNER_TEMP/release-notes.md" | grep -c '[^[:space:]]' || true)
          test "$body_lines" -gt 0 || {
            echo "CHANGELOG.md section '## [$script_version]' is empty; refusing to publish a blank release body" >&2
            exit 1
          }

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}   # built-in ref name; quoted below, never interpolated into shell
        run: |
          prerelease=()
          case "$TAG" in *-rc*|*-alpha*|*-beta*) prerelease=(--prerelease) ;; esac
          # No overwrite path: an existing release is an error, never a re-upload.
          # Published bytes are immutable — a changed byte gets a new version + tag
          # (the immutability promise in SECURITY.md).
          gh release create "$TAG" \
            conduck-connect.sh conduck-connect.sh.sha256 \
            LICENSE NOTICE THIRD_PARTY_NOTICES.md \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag "${prerelease[@]}"
